services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auvra
      POSTGRES_PASSWORD: auvra_local
      POSTGRES_DB: auvra
    ports: ["55432:5432"]
    volumes: ["auvra_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auvra"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["auvra_redis:/data"]
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: auvra-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9000:9090"]
    volumes: ["auvra_s3mock:/s3mockroot"]

volumes:
  auvra_postgres:
  auvra_redis:
  auvra_s3mock:
