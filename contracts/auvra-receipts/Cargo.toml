[package]
name = "auvra-receipts"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "1", optional = true }
borsh = "1.8.1"
near-sdk = { version = "=5.25.0", default-features = false }
near-workspaces = { version = "=0.23.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[features]
sandbox-tests = ["dep:anyhow", "dep:near-workspaces", "dep:tokio"]

[dev-dependencies]
near-sdk = { version = "=5.25.0", default-features = false, features = ["unit-testing"] }
